name: Build Dorino APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        id: build
        run: |
          set +e
          gradle assembleDebug --stacktrace --no-daemon > /tmp/gradle_build.log 2>&1
          echo "build_exit=$?" >> "$GITHUB_OUTPUT"
          tail -n 400 /tmp/gradle_build.log

      - name: Publish build log on failure
        if: steps.build.outputs.build_exit != '0'
        run: |
          git config user.email "ci@dorino.app"
          git config user.name "Dorino CI"
          tail -c 90000 /tmp/gradle_build.log > /tmp/last-failure.log
          git checkout --orphan ci-logs-branch
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p ci-logs
          cp /tmp/last-failure.log ci-logs/last-failure.log
          echo "run_id=${{ github.run_id }}" > ci-logs/last-failure-meta.txt
          git add ci-logs
          git commit -m "CI failure log for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-branch:ci-logs

      - name: Fail job if build failed
        if: steps.build.outputs.build_exit != '0'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorino-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
